[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spotify-lyrics-player"
version = "0.1.0"
description = "Display synchronized lyrics for the Spotify song currently playing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "spotipy>=2.23",
    "syncedlyrics>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
